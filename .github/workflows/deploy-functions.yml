# Deploys the Supabase Edge Functions (payments) whenever they change on main.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # The functions check the user's sign-in themselves, so the gateway check is off (see config.toml).
      - run: supabase functions deploy --project-ref xkeicbpqhualzgqrsnvi
